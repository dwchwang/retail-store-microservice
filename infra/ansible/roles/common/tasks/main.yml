- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install base packages (open-iscsi, nfs-common cho Longhorn)
  ansible.builtin.apt:
    name: [curl, jq, open-iscsi, nfs-common, fail2ban, unattended-upgrades]
    state: present

- name: Enable iscsid (Longhorn cần)
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Disable ufw (dùng Security Group; ufw xung đột với CNI của RKE2)
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped
  failed_when: false

- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      MaxAuthTries 3
      X11Forwarding no
  notify: Restart ssh

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
