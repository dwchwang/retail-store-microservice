[defaults]
inventory          = inventory/hosts.ini
remote_user        = ubuntu
private_key_file   = ~/.ssh/retail-store
host_key_checking  = False      # lab: IP đổi mỗi lần dựng lại
vault_password_file = ~/.ansible/retail-vault-pass
callback_result_format = yaml
forks              = 10

[ssh_connection]
pipelining = True